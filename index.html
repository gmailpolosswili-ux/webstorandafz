<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuxyy89Gmail - Storan Gmail</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #131b2e;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #94a3b8;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2563eb, #9333ea);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .rules-box {
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 15px;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-line;
        }
        #result {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Zuxyy89Gmail Stor</h2>
        
        <div class="form-group">
            <label>Rules & Ketentuan:</label>
            <div id="rulesContainer" class="rules-box">Memuat rules...</div>
        </div>

        <form id="storForm">
            <div class="form-group">
                <label>Password Wajib (prabujaya):</label>
                <input type="password" id="password" required placeholder="Masukkan password wajib">
            </div>

            <div class="form-group">
                <label>Daftar Email (1 per baris, wajib suffix 12):</label>
                <textarea id="emails" required placeholder="contoh: user12@gmail.com"></textarea>
            </div>

            <button type="submit">Kirim Storan</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        // Ambil rules dari backend saat halaman dibuka
        fetch('/api/status')
            .then(res => res.json())
            .then(data => {
                if(data.success && data.config) {
                    document.getElementById('rulesContainer').innerText = data.config.rulesText;
                }
            })
            .catch(err => console.error("Gagal memuat rules"));

        // Proses submit form storan
        document.getElementById('storForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const emails = document.getElementById('emails').value;
            const resultDiv = document.getElementById('result');

            resultDiv.style.color = "#94a3b8";
            resultDiv.innerText = "Mengirim...";

            try {
                const response = await fetch('/api/stor-gmail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emails, password })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.style.color = "#4ade80";
                    resultDiv.innerText = data.message;
                    document.getElementById('emails').value = '';
                } else {
                    resultDiv.style.color = "#f87171";
                    resultDiv.innerText = data.message;
                }
            } catch (err) {
                resultDiv.style.color = "#f87171";
                resultDiv.innerText = "Terjadi kesalahan koneksi ke server.";
            }
        });
    </script>
</body>
</html>
